<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجوزات Rohana</title>
<meta name="theme-color" content="#4a5c1c">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Montserrat:wght@500;600;700;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#efe6cd;--panel:#f8f1de;--ink:#3f4a17;--soft:#7d7a55;--line:#d9c9a0;--red:#bd5a27;--red-deep:#4a5c1c;--red-dark:#33410f;--gold:#efe6cd;--gold-deep:#dccfa8;--ok:#4f7a2a;--font:'Montserrat','Cairo',sans-serif;--display:'Rubik','Cairo',sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
  button,input,select{font-family:var(--font)}
  header{background:linear-gradient(135deg,var(--red-deep),var(--red-dark));color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  header h1{margin:0;font-size:20px;font-weight:900}
  header h1 span{color:var(--gold)}
  .hb{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:none;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
  .gold{background:var(--gold);color:var(--red-dark)}.gold:hover{background:var(--gold-deep)}
  .ghost{background:rgba(255,255,255,.12);color:#fff}
  main{max-width:900px;margin:0 auto;padding:18px 16px 60px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:1.5px solid var(--line);background:#fff;padding:7px 14px;border-radius:99px;font-weight:700;font-size:13px;cursor:pointer}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff}
  .bar input,.bar select{padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;background:#fff}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-inline-start:4px solid var(--red)}
  .kpi:nth-child(2){border-color:var(--ok)}.kpi:nth-child(3){border-color:#b9a99d}.kpi:nth-child(4){border-color:var(--gold-deep)}
  em{font-style:normal}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
  .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .ph h3{margin:0;font-size:15px;font-weight:800}
  .ph input{padding:6px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
  .lg{font-size:12px;color:var(--soft);font-weight:700;margin:8px 0}
  .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:middle}
  .kpi b{display:block;font-size:24px;font-weight:900}.kpi span{font-size:12px;color:var(--soft);font-weight:700}
  .day{font-size:13px;font-weight:800;color:var(--soft);margin:18px 2px 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .time{min-width:56px;text-align:center;font-weight:900;font-size:17px;color:var(--red-deep)}
  .info{flex:1;min-width:150px}.info b{font-size:15px}
  .meta{font-size:12px;color:var(--soft);font-weight:600;margin-top:2px}
  .badge{padding:3px 11px;border-radius:99px;font-size:11.5px;font-weight:800}
  .new{background:#fff3cf;color:#8a6500}.ok{background:#e3f4ea;color:var(--ok)}.no{background:#fde7e8;color:#b5311f}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts .btn{padding:6px 12px;font-size:12.5px}
  .b-ok{background:var(--ok);color:#fff}.b-no{background:#fde7e8;color:#b5311f}.b-wa{background:var(--red);color:#fff}
  .logo{height:34px;width:34px;border-radius:9px;vertical-align:middle;margin-inline-end:6px}
  .empty{text-align:center;color:var(--soft);padding:40px 0;font-weight:700}
  .ov{position:fixed;inset:0;background:linear-gradient(135deg,var(--red-deep),var(--red-dark));display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .box{background:#fff;border-radius:16px;padding:26px 22px;width:100%;max-width:340px;text-align:center}
  .box h2{margin:0 0 14px;font-size:19px;font-weight:900}
  .box input,.box select{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:10px;font-size:14px;margin-top:8px;background:#fff8ef}
  .box .btn{width:100%;margin-top:10px;padding:11px;font-size:15px}
  .err{color:var(--red);font-size:13px;font-weight:700;min-height:18px;margin-top:6px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--red-dark);color:#fff;padding:10px 20px;border-radius:10px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
  .toast.show{opacity:1}
  @media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr);gap:8px}.kpi b{font-size:20px}}

  header h1,.kpi b,.time,.box h2{font-family:var(--display);letter-spacing:.5px}
  header h1{text-transform:uppercase;font-weight:800}
  .day{display:inline-block;background:var(--red-deep);color:var(--gold);padding:5px 18px;border-radius:99px 99px 99px 12px;font-family:var(--display);font-weight:600;font-size:13px;margin:18px 0 10px}
  .card,.kpi,.panel{background:var(--panel);border-color:var(--line);border-radius:18px}
  .chip{font-family:var(--display);font-weight:600}
  .kpi b{color:var(--red-deep)}
  body::after{content:"";display:block;height:90px;margin-top:30px;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 100' preserveAspectRatio='none'><path d='M0 55Q180 15 380 50T760 45T1200 30V100H0Z' fill='%23dcc08f'/><path d='M0 72Q240 38 520 68T1200 58V100H0Z' fill='%23bd5a27'/><path d='M0 90Q300 66 620 88T1200 80V100H0Z' fill='%234a5c1c'/></svg>") bottom/100% 100% no-repeat}

  /* ===== fun Rohana styling ===== */
  :root{--terra:#bd5a27;--brown:#7b3a1c;--sand:#dcc08f;--sage:#8a9a4b}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  header{position:relative;overflow:hidden;background:var(--red-deep);padding:18px 20px 70px}
  header::before{content:"";position:absolute;inset-inline-start:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:var(--terra);opacity:.85}
  header>*{position:relative}
  header .hills{position:absolute;left:0;bottom:-1px;width:100%;height:60px;display:block;z-index:0}
  header .cactus{position:absolute;bottom:26px;inset-inline-end:34%;width:30px;height:60px;z-index:0;animation:bob 3.2s ease-in-out infinite}
  header h1{font-size:22px;letter-spacing:2px;display:flex;align-items:center;gap:6px}
  header h1 span{color:var(--sand);font-weight:600}
  .logo{border-radius:50%;border:2px solid var(--gold);height:40px;width:40px;object-fit:cover}
  .btn{transition:transform .15s,background .2s;font-family:var(--display);letter-spacing:.3px}
  .btn:hover{transform:translateY(-2px) rotate(-1deg)}.btn:active{transform:scale(.95)}
  .gold{border-radius:99px 14px 99px 99px}
  .ghost{background:rgba(239,230,205,.18);border:1.5px solid rgba(239,230,205,.4)}
  .ghost:hover{background:rgba(239,230,205,.3)}
  main{margin-top:-34px;position:relative;z-index:2}
  .bar{background:var(--panel);border:2px solid var(--sand);border-radius:22px;padding:12px;box-shadow:0 14px 34px rgba(74,92,28,.15)}
  .chip{background:#fffaf0;border:2px solid var(--sand);transition:transform .15s,background .2s}
  .chip:hover{transform:translateY(-2px);background:#efe3c3}
  .chip.on{background:var(--red-deep);border-color:var(--red-deep);color:var(--gold);border-radius:99px 99px 99px 12px}
  .bar input,.bar select,.ph input{border:2px solid var(--sand);border-radius:14px;background:#fffaf0;color:var(--ink);font-weight:600}
  .bar input:focus,.bar select:focus,.ph input:focus,.box input:focus,.box select:focus{outline:none;border-color:var(--red-deep)}
  .kpi{position:relative;overflow:hidden;border:2px solid var(--sand);border-inline-start-width:2px;box-shadow:0 8px 20px rgba(74,92,28,.1);transition:transform .2s;animation:pop .4s both}
  .kpi:hover{transform:translateY(-4px) rotate(-1deg)}
  .kpi:nth-child(1){background:#f3dfc3}.kpi:nth-child(2){background:#e4ebcb}.kpi:nth-child(3){background:#f6dcd0}.kpi:nth-child(4){background:#fff3cf}
  .kpi:nth-child(2){animation-delay:.07s}.kpi:nth-child(3){animation-delay:.14s}.kpi:nth-child(4){animation-delay:.21s}
  .kpi b{font-size:30px;color:var(--brown)}
  .panel{border:2px solid var(--sand);box-shadow:0 8px 20px rgba(74,92,28,.1)}
  .ph h3{font-family:var(--display);color:var(--red-deep);font-size:16px}
  #chart g:hover rect:not([fill=transparent]){filter:brightness(1.15)}
  .day{box-shadow:0 4px 10px rgba(74,92,28,.2);background:var(--red-deep)}
  .card{border:2px solid var(--sand);border-inline-start:8px solid var(--sage);animation:pop .35s both;transition:transform .2s,box-shadow .2s}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(74,92,28,.15)}
  .card.new,.card.ok,.card.no{color:var(--ink)}
  .card.new{border-inline-start-color:#e0a82e;background:#fffaf0}
  .card.ok{border-inline-start-color:var(--sage);background:var(--panel)}
  .card.no{border-inline-start-color:var(--terra);background:#f8ece3;opacity:.85}
  .time{background:var(--red-deep);color:var(--gold);border-radius:14px;padding:8px 10px;min-width:64px;font-size:16px}
  .badge{font-family:var(--display);border:2px solid currentColor;font-size:12px}
  .badge.new{background:#fff3cf;color:#8a6500}.badge.ok{background:#e4ebcb;color:var(--red-dark)}.badge.no{background:#f6dcd0;color:#9a2f12}
  .b-ok{background:var(--red-deep)}.b-no{background:#f6dcd0;color:#9a2f12}.b-wa{background:var(--terra)}
  .empty{font-family:var(--display);font-size:17px}
  .ov{background:var(--red-deep);overflow:hidden}
  .ov::before{content:"";position:absolute;inset-inline-end:-70px;top:-50px;width:240px;height:240px;border-radius:50%;background:var(--terra);opacity:.85}
  .ov::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 100' preserveAspectRatio='none'><path d='M0 55Q180 15 380 50T760 45T1200 30V100H0Z' fill='%23dcc08f'/><path d='M0 72Q240 38 520 68T1200 58V100H0Z' fill='%23bd5a27'/><path d='M0 90Q300 66 620 88T1200 80V100H0Z' fill='%234a5c1c'/></svg>") bottom/100% 100% no-repeat}
  .box{position:relative;z-index:2;background:var(--panel);border:2px solid var(--sand);border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .4s both}
  .box h2{color:var(--red-deep);text-transform:uppercase;letter-spacing:1px}
  .box input,.box select{background:#fffaf0;border-color:var(--sand);border-radius:14px;font-weight:600}
  #addM{overflow-y:auto}
  #addM .box{max-height:94vh;overflow-y:auto}
  .toast{background:var(--red-deep);border:2px solid var(--sand);border-radius:99px;padding:10px 24px;font-family:var(--display)}
  body::after{margin-top:40px}
</style>
</head>

<script>
  // لينك الـ Web App (/exec) — بيتستخدم لما الصفحة تتفتح كملف عادي برّه Apps Script
  const API_URL = "https://script.google.com/macros/s/AKfycbwJC3JJ5v1DE4Yvpg9hM3m8yQf7R2xBziuwXZEMJCPExZCErBeHucQMzjyIk95D9Ksf/exec";
  const inside = typeof google !== 'undefined' && google.script && google.script.run;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = (o = 0) => { const d = new Date(); d.setDate(d.getDate() + o); return d.toLocaleDateString('en-CA'); };
  let pass = '', all = [], week = false;
  try { pass = localStorage.getItem('rhPass') || ''; } catch (e) {}

  function toast(m) { $('toast').textContent = m; $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 2200); }
  function showLogin(m) { $('le').textContent = m || ''; $('lp').value = ''; $('login').style.display = 'flex'; }
  function logout(m) { pass = ''; try { localStorage.removeItem('rhPass'); } catch (e) {} showLogin(m); }
  function fail(err) { $('list').innerHTML = '<div class="empty">حصل خطأ: ' + esc(err && err.message ? err.message : err) + '</div>'; }

  function call(fn, action, args, params, done) {
    if (inside) google.script.run.withSuccessHandler(done).withFailureHandler(fail)[fn](...args, pass);
    else fetch(API_URL + '?' + new URLSearchParams(Object.assign({ action, pass }, params))).then(r => r.json()).then(done).catch(fail);
  }
  function ok(res) {
    if (res && res.error === 'unauthorized') { logout('كلمة السر غلط'); return false; }
    if (res && res.ok === false) { toast(res.error || 'حصل خطأ'); return false; }
    return true;
  }

  function load() {
    if (!pass) return showLogin();
    $('list').innerHTML = '<div class="empty loading">جاري التحميل…</div>';
    call('listBookings', 'list', [], {}, res => {
      if (!ok(res)) return;
      $('login').style.display = 'none';
      all = res.bookings || [];
      const br = [...new Set(all.map(b => b.space).filter(Boolean))];
      const cur = $('fSpace').value;
      $('fSpace').innerHTML = '<option value="">كل المساحات</option>' + br.map(b => `<option>${esc(b)}</option>`).join('');
      $('fSpace').value = cur;
      $('bl').innerHTML = br.map(b => `<option value="${esc(b)}">`).join('');
      render();
    });
  }

  const key = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
  const dayName = d => {
    const dt = new Date(d + 'T00:00:00'), diff = Math.round((dt - new Date(today() + 'T00:00:00')) / 864e5);
    const n = dt.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' });
    return (diff === 0 ? 'اليوم — ' : diff === 1 ? 'بكرة — ' : diff === -1 ? 'امبارح — ' : '') + n;
  };

  function render() {
    chart();
    const d = $('fDate').value, br = $('fSpace').value, st = $('fStatus').value, q = $('fSearch').value.trim().toLowerCase();
    const rows = all.filter(b =>
      (!week || d || (b.date >= today() && b.date <= today(6))) &&
      (!d || b.date === d) && (!br || b.space === br) && (!st || b.status === st) &&
      (!q || (b.name + ' ' + b.phone).toLowerCase().includes(q))
    ).sort((a, b) => a.date.localeCompare(b.date) || key(a.time) - key(b.time));

    const live = rows.filter(r => r.status !== 'ملغي');
    $('kN').textContent = rows.length;
    $('kG').textContent = live.reduce((s, r) => s + (parseFloat(r.total) || 0), 0);
    $('kOk').textContent = rows.filter(r => r.status === 'مؤكد').length;
    $('kNo').textContent = rows.length - live.length;
    $('kNew').textContent = rows.filter(r => r.status === 'جديد').length;
    if (!rows.length) { $('list').innerHTML = '<div class="empty">مفيش حجوزات مطابقة</div>'; return; }

    let html = '', last = '';
    rows.forEach((b, i) => {
      if (b.date !== last) { html += `<div class="day">${dayName(b.date)}</div>`; last = b.date; }
      const cls = b.status === 'ملغي' ? 'no' : b.status === 'مؤكد' ? 'ok' : 'new';
      const acts = b.status === 'ملغي'
        ? `<button class="btn b-ok" onclick="setSt(${b.row},'جديد')">استرجاع</button>`
        : (b.status === 'جديد' ? `<button class="btn b-ok" onclick="setSt(${b.row},'مؤكد')">تأكيد</button>` : '') +
          `<button class="btn b-no" onclick="setSt(${b.row},'ملغي')">إلغاء</button>`;
      html += `<div class="card ${cls}" style="animation-delay:${Math.min(i,10)*30}ms">
        <div class="time">${esc(b.time)}</div>
        <div class="info"><b>${esc(b.name)}</b> · ${esc(b.duration)} س
          <div class="meta">${esc(b.phone)}${b.space ? ' · ' + esc(b.space) : ''} · ${esc(b.total)} ج</div></div>
        <span class="badge ${cls}">${esc(b.status)}</span>
        <div class="acts">${acts}<button class="btn b-wa" onclick="wa(${b.row})">واتساب</button></div>
      </div>`;
    });
    $('list').innerHTML = html;
  }

  // رسم بياني: عدد الحجوزات في كل يوم من الشهر (أحمر = شغال، رمادي = ملغي)
  function chart() {
    const m = $('fMonth').value || today().slice(0, 7), br = $('fSpace').value;
    const [y, mo] = m.split('-').map(Number), n = new Date(y, mo, 0).getDate();
    const a = Array(n + 1).fill(0), c = Array(n + 1).fill(0);
    all.forEach(b => {
      if (b.date.slice(0, 7) !== m || (br && b.space !== br)) return;
      (b.status === 'ملغي' ? c : a)[+b.date.slice(8, 10)]++;
    });
    const W = 700, H = 160, pb = 22, pt = 16, cw = W / n;
    const max = Math.max(1, ...a.map((v, i) => v + c[i])), u = (H - pb - pt) / max;
    let svg = '';
    for (let d = 1; d <= n; d++) {
      const x = (d - 1) * cw + cw * 0.18, w = cw * 0.64, ha = a[d] * u, hc = c[d] * u, ya = H - pb - ha, yc = ya - hc;
      const dt = m + '-' + String(d).padStart(2, '0');
      svg += `<g style="cursor:pointer" onclick="pick('${dt}')"><rect x="${x}" y="0" width="${w}" height="${H}" fill="transparent"/>` +
        (a[d] ? `<rect x="${x}" y="${ya}" width="${w}" height="${ha}" rx="3" fill="#bd5a27"/>` : '') +
        (c[d] ? `<rect x="${x}" y="${yc}" width="${w}" height="${hc}" rx="3" fill="#d9c9bd"/>` : '') +
        (a[d] + c[d] ? `<text x="${x + w / 2}" y="${yc - 3}" font-size="10" font-weight="700" text-anchor="middle" fill="#33410f">${a[d] + c[d]}</text>` : '') +
        `<text x="${x + w / 2}" y="${H - 7}" font-size="9" text-anchor="middle" fill="#8a7a72">${d}</text><title>${dt}: ${a[d]} حجز، ${c[d]} ملغي</title></g>`;
    }
    $('chart').innerHTML = svg;
  }
  function pick(dt) {
    week = false; $('fDate').value = dt;
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    render(); $('list').scrollIntoView({ behavior: 'smooth' });
  }

  function setSt(row, status) {
    call('updateStatus', 'updateStatus', [row, status], { row, status }, res => { if (ok(res)) { toast('اتسجلت الحالة: ' + status); load(); } });
  }

  function wa(row) {
    const b = all.find(x => x.row === row); if (!b) return;
    let p = b.phone.replace(/\D/g, ''); if (p.startsWith('0')) p = '2' + p;
    const m = `أهلاً ${b.name}، حجزك في Rohana ${b.status === 'ملغي' ? 'اتلغى' : 'متأكد'}:\n${dayName(b.date)}\nالساعة ${b.time}\nلمدة ${b.duration} ساعة${b.space ? '\nالمساحة: ' + b.space : ''}`;
    window.open('https://wa.me/' + p + '?text=' + encodeURIComponent(m), '_blank');
  }

  // ---- أحداث ----
  function doLogin() { const v = $('lp').value; if (!v) return; pass = v; try { localStorage.setItem('rhPass', v); } catch (e) {} load(); }
  $('lb').onclick = doLogin;
  $('lp').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
  $('outBtn').onclick = () => { logout(); all = []; };
  $('refBtn').onclick = load;
  ['fDate', 'fSpace', 'fStatus'].forEach(id => $(id).onchange = () => { if (id === 'fDate') { week = false; document.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); } render(); });
  $('fSearch').oninput = render;
  $('fMonth').onchange = chart;
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); c.classList.add('on');
    const q = c.dataset.q; week = q === 'week';
    $('fDate').value = q === 'today' ? today() : q === 'tomorrow' ? today(1) : '';
    render();
  });
  $('addBtn').onclick = () => { $('aDate').value = $('fDate').value || today(); $('addM').style.display = 'flex'; };
  $('aNo').onclick = () => { $('addM').style.display = 'none'; };
  $('aOk').onclick = () => {
    const d = { name: $('aName').value.trim(), phone: $('aPhone').value.trim(), space: $('aSpace').value.trim(),
                date: $('aDate').value, time: $('aTime').value, duration: $('aG').value, total: $('aTotal').value };
    if (!d.name || !d.date || !d.time) { toast('الاسم والتاريخ والوقت مطلوبين'); return; }
    call('addBooking', 'add', [d], d, res => { if (ok(res)) { $('addM').style.display = 'none'; ['aName', 'aPhone', 'aTotal'].forEach(i => $(i).value = ''); toast('اتضاف الحجز'); load(); } });
  };

  $('fDate').value = today();
  $('fMonth').value = today().slice(0, 7);
  load();
</script>
</body>
</html>
